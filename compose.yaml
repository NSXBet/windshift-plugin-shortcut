# Dev stack: published core image — ghcr.io/nsxbet/windshift:v0.8.9-p1
# (rebuilt 2026-10-10 from internal/v0.8.9 @2b0d7e4f, carries the Shortcut
# host functions item_upsert/item_lookup/member_upsert/iteration_upsert)
# with the locally built plugin bind-mounted at /plugins.
# Plugin loop: task build && task install && task run · hot reload: task reload · reset: task clean.
services:
  windshift:
    image: ghcr.io/nsxbet/windshift:v0.8.9-p1
    # Image runs as 65534, but named volumes are root-owned → SQLite can't
    # create /data/windshift.db. Dev-only override; prod chart sets its own.
    user: "0:0"
    command: ["-no-csrf", "-log-level", "debug"]
    ports:
      - "8080:8080"
    environment:
      SSO_SECRET: dev-secret-for-testing
      PLUGIN_DIRS: /plugins
      # Sync ticks make several Shortcut API calls; the 5s default ceiling
      # kills an invocation on a single slow round-trip.
      PLUGINS_TIMEOUT: "120"
    volumes:
      - ./.dev/plugins:/plugins
      - windshift-dev-data:/data

volumes:
  windshift-dev-data:
