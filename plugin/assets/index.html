<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shortcut Migration</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 1.5rem; color: inherit; }
    h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
    p.sub { color: var(--ds-text-subtle, #888); font-size: 0.85rem; margin: 0 0 1rem; }
    .error { color: #d33; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Shortcut Migration</h1>
  <p class="sub">Skeleton — migration handlers are not implemented yet. This tab validates the deployment: plugin loaded, routes mounted, KV host-function ABI reachable.</p>

  <div>Status: <code id="status">checking…</code></div>
  <p id="error" class="error"></p>

  <script type="module">
    const base = '.'; // page lives at /api/plugins/shortcut/assets/index.html

    const show = (e) => { document.getElementById('error').textContent = String(e.message || e); };

    try {
      const res = await fetch(`${base}/status`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
      document.getElementById('status').textContent =
        `v${data.version} — KV host function ${data.kv ? 'reachable' : 'FAILED'}`;
    } catch (e) { show(e); }
  </script>
</body>
</html>
