<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shortcuts plugin</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 1.5rem; color: inherit; }
    h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
    p.sub { color: var(--ds-text-subtle, #888); font-size: 0.85rem; margin: 0 0 1rem; }
    .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
    input { flex: 1; padding: 0.4rem 0.6rem; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; }
    ul { padding-left: 1.2rem; }
    li { margin: 0.3rem 0; }
    li button { margin-left: 0.4rem; }
    .visits { font-size: 1.5rem; font-weight: 600; }
    .error { color: #d33; }
    a { word-break: break-all; }
  </style>
</head>
<body>
  <h1>Shortcuts</h1>
  <p class="sub">Sample Windshift plugin — state persists in the host KV store.</p>

  <div>Visits: <span id="visits">…</span></div>
  <div>Status: <span id="status">…</span></div>

  <hr />
  <form id="add">
    <div class="row">
      <input id="label" placeholder="Label (e.g. sprint-42)" required />
      <input id="url" placeholder="https://app.shortcut.com/…" required />
      <button type="submit">Add</button>
    </div>
  </form>

  <ul id="bookmarks"></ul>
  <p id="error" class="error"></p>

  <script type="module">
    const base = '.'; // page lives at /api/plugins/shortcuts/assets/index.html

    async function api(method, path, body) {
      const res = await fetch(`${base}/${path}`, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
      return data;
    }

    function showBookmarks(list) {
      const ul = document.getElementById('bookmarks');
      ul.replaceChildren(...list.map((b) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = b.url;
        a.textContent = `${b.label} — ${b.url}`;
        a.target = '_blank';
        const del = document.createElement('button');
        del.textContent = '✕';
        del.onclick = async () => {
          try {
            showBookmarks(await api('DELETE', `bookmarks?label=${encodeURIComponent(b.label)}`));
          } catch (e) { show(e); }
        };
        li.append(a, del);
        return li;
      }));
    }

    const show = (e) => { document.getElementById('error').textContent = String(e.message || e); };

    async function refresh() {
      try {
        const [status, counter, bookmarks] = await Promise.all([
          api('GET', 'status'),
          api('GET', 'counter'),
          api('GET', 'bookmarks'),
        ]);
        document.getElementById('status').textContent = status.kv ? 'ok (KV host function reachable)' : 'KV host function failed';
        document.getElementById('visits').textContent = counter.visits;
        showBookmarks(bookmarks);
      } catch (e) { show(e); }
    }

    document.getElementById('add').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const label = document.getElementById('label').value.trim();
        const url = document.getElementById('url').value.trim();
        showBookmarks(await api('POST', 'bookmarks', { label, url }));
        e.target.reset();
      } catch (err) { show(err); }
    };

    refresh();
  </script>
</body>
</html>
